<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>پروژه‌ها — Webify.af</title>
    <meta name="description" content="نمونه‌کارها، مخازن GitHub و مطالعات موردی وبیفای.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.projects"></b></nav>
            <p class="kicker" data-scramble data-i18n="projects.hero.kicker"></p>
            <h1 class="ml" data-i18n="projects.hero.title"></h1>
            <p class="hero-sub" data-i18n="projects.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="grid" data-spy>
        <div class="container">
            <div class="fbar reveal">
                <button class="fbtn on" data-f="all" data-i18n="projects.filters.all"></button>
                <button class="fbtn" data-f="saas" data-i18n="projects.filters.saas"></button>
                <button class="fbtn" data-f="web" data-i18n="projects.filters.web"></button>
                <button class="fbtn" data-f="mobile" data-i18n="projects.filters.mobile"></button>
                <button class="fbtn" data-f="oss" data-i18n="projects.filters.oss"></button>
            </div>
            <div data-render="projGrid"></div>
        </div>
    </section>

    <section class="sec alt" id="repos" data-spy>
        <div class="container">
            <header class="sec-head reveal">
                <p class="kicker" data-i18n="projects.repos.kicker"></p>
                <h2 data-i18n="projects.repos.title"></h2>
                <p class="lead" data-i18n="projects.repos.sub"></p>
            </header>
            <div data-render="repos"></div>
        </div>
    </section>

    <section class="sec" id="case" data-spy>
        <div class="container split">
            <div class="reveal">
                <p class="kicker" data-i18n="projects.case.kicker"></p>
                <h2 data-i18n="projects.case.title"></h2>
                <p class="lead" style="margin-top:8px;color:var(--saffron-deep);font-weight:600" data-i18n="projects.case.client"></p>
                <p class="lead" style="margin-top:12px" data-i18n="projects.case.d"></p>
                <div class="facts" style="margin-block:22px">
                    <div><b><span data-count="70">0</span>%</b><small data-i18n="projects.case.results.0.l"></small></div>
                    <div><b><span data-count="3">0</span>×</b><small data-i18n="projects.case.results.1.l"></small></div>
                    <div><b><span data-count="99.9" data-dec="1">0</span>%</b><small data-i18n="projects.case.results.2.l"></small></div>
                </div>
                <blockquote class="case-quote"><p data-i18n="projects.case.quote.q"></p><small data-i18n="projects.case.quote.n"></small></blockquote>
                <a class="btn btn-primary" style="margin-top:22px" href="contact.html" data-i18n="projects.case.cta.t"></a>
            </div>
            <figure class="case-fig reveal" style="--d:120ms"><img src="https://picsum.photos/seed/webify-case-logistics/720/560" alt="case study"></figure>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
<script src="js/lang-prs.js"></script><script src="js/lang-ps.js"></script><script src="js/lang-en.js"></script><script src="js/main.js"></script>
</body>
</html>

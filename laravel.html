<main id="main">

            <div>
                <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><a href="services.html" data-i18n="meta.services"></a><span>/</span><b data-i18n="meta.laravel"></b></nav>

            <div data-render="featLaravel"></div>
        </div>

            <div data-render="procLaravel"></div>

    <section class="sec" id="faq" data-spy>
        <div class="container" style="max-width:820px">

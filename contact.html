<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تماس با ما — Webify.af</title>
    <meta name="description" content="تماس با تیم وبیفای — فرم، ایمیل و لینک‌های حرفه‌ای.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.contact"></b></nav>
            <p class="kicker" data-scramble data-i18n="contact.hero.kicker"></p>
            <h1 class="ml" data-i18n="contact.hero.title"></h1>
            <p class="hero-sub" data-i18n="contact.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="form" data-spy>
        <div class="container split">
            <div class="reveal">
                <p class="kicker" data-i18n="contact.form.kicker"></p>
                <h2 data-i18n="contact.form.title"></h2>
                <form class="js-form" novalidate style="margin-top:22px">
                    <div class="field"><label data-i18n="contact.form.name"></label><input type="text" required data-i18n-ph="contact.form.ph_name"><small class="fmsg"></small></div>
                    <div class="field"><label data-i18n="contact.form.email"></label><input type="email" required data-i18n-ph="contact.form.ph_email"><small class="fmsg"></small></div>
                    <div class="field"><label data-i18n="contact.form.subject"></label><input type="text" required data-i18n-ph="contact.form.ph_subject"><small class="fmsg"></small></div>
                    <div class="field"><label data-i18n="contact.form.message"></label><textarea required data-i18n-ph="contact.form.ph_message"></textarea><small class="fmsg"></small></div>
                    <button class="btn btn-accent btn-cut" type="submit" data-i18n="contact.form.send"></button>
                </form>
            </div>
            <div id="info" class="reveal" style="--d:120ms">
                <div class="card">
                    <p class="kicker" data-i18n="contact.info.kicker"></p>
                    <h3 style="margin-block:8px 14px" data-i18n="contact.info.title"></h3>
                    <div class="info-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7.5l9 6 9-6"/></svg><div><b data-i18n="contact.info.emailL"></b><span data-i18n="contact.info.email"></span></div></div>
                    <div class="info-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l1.6 4.2L8.2 10a12.5 12.5 0 0 0 5.8 5.8l1.8-2.4L20 15v4c-9 1-16-6-15-15z"/></svg><div><b data-i18n="contact.info.phoneL"></b><span data-i18n="contact.info.phone"></span></div></div>
                    <div class="info-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><div><b data-i18n="contact.info.addrL"></b><span style="direction:inherit" data-i18n="contact.info.addr"></span></div></div>
                    <div class="info-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><div><b data-i18n="contact.info.hoursL"></b><span style="direction:inherit" data-i18n="contact.info.hours"></span></div></div>
                </div>
                <figure class="mapfig"><img src="https://picsum.photos/seed/webify-kabul-map/900/420" data-i18n-alt="contact.map.alt" alt="map"></figure>
            </div>
        </div>
    </section>

    <section class="sec alt" id="links" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="contact.links.kicker"></p><h2 data-i18n="contact.links.title"></h2></header>
            <div data-render="contactLinks"></div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
<script src="js/lang-prs.js"></script><script src="js/lang-ps.js"></script><script src="js/lang-en.js"></script><script src="js/main.js"></script>
</body>
</html>

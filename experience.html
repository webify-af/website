<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تجربه‌ها — Webify.af</title>
    <meta name="description" content="مسیر حرفه‌ای، فریلنسینگ و مشارکت‌های متن‌باز تیم وبیفای.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="experience">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.experience"></b></nav>
            <p class="kicker" data-scramble data-i18n="experience.hero.kicker"></p>
            <h1 class="ml" data-i18n="experience.hero.title"></h1>
            <p class="hero-sub" data-i18n="experience.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="timeline" data-spy>
        <div class="container" style="max-width:860px">
            <header class="sec-head reveal"><p class="kicker" data-i18n="experience.hero.kicker"></p><h2 data-i18n="experience.pn.0.l"></h2></header>
            <div data-render="timeline"></div>
        </div>
    </section>

    <section class="sec alt" id="freelance" data-spy>
        <div class="container split">
            <div class="reveal">
                <p class="kicker" data-i18n="experience.free.kicker"></p>
                <h2 data-i18n="experience.free.title"></h2>
                <p class="lead" style="margin-top:12px" data-i18n="experience.free.d"></p>
                <div class="facts" style="margin-top:22px">
                    <div><b><span data-count="40">0</span>+</b><small data-i18n="experience.free.stats.0.l"></small></div>
                    <div><b><span data-count="100">0</span>%</b><small data-i18n="experience.free.stats.1.l"></small></div>
                </div>
            </div>
            <div data-render="platforms"></div>
        </div>
    </section>

    <section class="sec" id="oss" data-spy>
        <div class="container">
            <header class="sec-head reveal">
                <p class="kicker" data-i18n="experience.oss.kicker"></p>
                <h2 data-i18n="experience.oss.title"></h2>
                <p class="lead" data-i18n="experience.oss.sub"></p>
            </header>
            <div data-render="oss"></div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>

<script src="lang/prs.js"></script>
<script src="lang/ps.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
</body>
</html>

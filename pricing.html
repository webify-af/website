<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تعرفه‌ها — Webify.af</title>
    <meta name="description" content="مقایسه قیمت هاستینگ، سرور مجازی و خدمات نرم‌افزاری وبیفای.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pricing">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.pricing"></b></nav>
            <p class="kicker" data-scramble data-i18n="pricing.hero.kicker"></p>
            <h1 class="ml" data-i18n="pricing.hero.title"></h1>
            <p class="hero-sub" data-i18n="pricing.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="hosting" data-spy>
        <div class="container">
            <div class="seg" role="group">
                <button class="seg-btn on" data-period="m" data-i18n="common.monthly"></button>
                <button class="seg-btn" data-period="y"><span data-i18n="common.yearly"></span><i data-i18n="common.saveTip"></i></button>
            </div>
            <header class="sec-head reveal"><p class="kicker" data-i18n="pricing.hosting.kicker"></p><h2 data-i18n="pricing.hosting.title"></h2></header>
            <div data-render="prHosting" class="reveal"></div>
        </div>
    </section>

    <section class="sec alt" id="vps" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="pricing.vps.kicker"></p><h2 data-i18n="pricing.vps.title"></h2></header>
            <div data-render="prVps" class="reveal"></div>
        </div>
    </section>

    <section class="sec" id="svc" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="pricing.svc.kicker"></p><h2 data-i18n="pricing.svc.title"></h2></header>
            <div data-render="prSvc" class="reveal"></div>
            <p class="tnote reveal" data-i18n="pricing.note"></p>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
<script src="js/lang-prs.js"></script><script src="js/lang-ps.js"></script><script src="js/lang-en.js"></script><script src="js/main.js"></script>
</body>
</html>

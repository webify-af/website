<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>خدمات نرم‌افزاری — Webify.af</title>
    <meta name="description" content="توسعه نرم‌افزار سفارشی و محصولات SaaS با تیم وبیفای.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.services"></b></nav>
            <p class="kicker" data-scramble data-i18n="services.hero.kicker"></p>
            <h1 class="ml" data-i18n="services.hero.title"></h1>
            <p class="hero-sub" data-i18n="services.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="caps" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="services.caps.kicker"></p><h2 data-i18n="services.caps.title"></h2><p class="lead" data-i18n="services.caps.sub"></p></header>
            <div data-render="caps"></div>
        </div>
    </section>

    <section class="sec alt" id="process" data-spy>
        <div class="container" style="max-width:860px">
            <header class="sec-head reveal"><p class="kicker" data-i18n="services.proc.kicker"></p><h2 data-i18n="services.proc.title"></h2></header>
            <div data-render="proc"></div>
        </div>
    </section>

    <section class="sec" id="saas" data-spy>
        <div class="container split">
            <div class="reveal">
                <p class="kicker" data-i18n="services.saas.kicker"></p>
                <h2 data-i18n="services.saas.title"></h2>
                <p class="lead" style="margin-top:12px" data-i18n="services.saas.d"></p>
                <ul class="tick" style="margin-top:18px">
                    <li data-i18n="services.saas.feats.0"></li>
                    <li data-i18n="services.saas.feats.1"></li>
                    <li data-i18n="services.saas.feats.2"></li>
                    <li data-i18n="services.saas.feats.3"></li>
                </ul>
                <a class="btn btn-primary" style="margin-top:22px" href="contact.html" data-i18n="services.saas.cta.t"></a>
            </div>
            <figure class="case-fig sticky reveal" style="--d:120ms"><img src="https://picsum.photos/seed/webify-saas-build/720/560" alt="SaaS"></figure>
        </div>
    </section>

    <section class="sec alt" id="stack" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="services.stack.kicker"></p><h2 data-i18n="services.stack.title"></h2></header>
            <div data-render="svcStack"></div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>

<script src="lang/prs.js"></script>
<script src="lang/ps.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
</body>
</html>

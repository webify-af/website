<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>صفحه اصلی — Webify.af</title>
    <meta name="description" content="وبیفای — تیم توسعه نرم‌افزار، محصولات SaaS، هاستینگ و سرور مجازی از کابل.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8a33d' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <div class="slider" data-render="slider" aria-roledescription="carousel"></div>

    <section class="sec slim"><div data-render="stats"></div></section>

    <section class="sec">
        <div class="container">
            <header class="sec-head reveal">
                <p class="kicker" data-i18n="home.svc.kicker"></p>
                <h2 data-i18n="home.svc.title"></h2>
                <p class="lead" data-i18n="home.svc.sub"></p>
            </header>
            <div data-render="svc"></div>
        </div>
    </section>

    <section class="sec alt" id="why">
        <div class="container split">
            <div class="sticky reveal">
                <p class="kicker" data-i18n="home.why.kicker"></p>
                <h2 data-i18n="home.why.title"></h2>
                <p class="lead" data-i18n="home.why.sub"></p>
                <figure class="why-fig"><img src="https://picsum.photos/seed/webify-office-work/720/520" alt="Webify office"></figure>
            </div>
            <div class="why-list">
                <div class="card why-item reveal"><b class="wnum">01</b><div><h3 data-i18n="home.why.items.0.t"></h3><p data-i18n="home.why.items.0.d"></p></div></div>
                <div class="card why-item reveal" style="--d:90ms"><b class="wnum">02</b><div><h3 data-i18n="home.why.items.1.t"></h3><p data-i18n="home.why.items.1.d"></p></div></div>
                <div class="card why-item reveal" style="--d:180ms"><b class="wnum">03</b><div><h3 data-i18n="home.why.items.2.t"></h3><p data-i18n="home.why.items.2.d"></p></div></div>
                <div class="card why-item reveal" style="--d:270ms"><b class="wnum">04</b><div><h3 data-i18n="home.why.items.3.t"></h3><p data-i18n="home.why.items.3.d"></p></div></div>
            </div>
        </div>
    </section>

    <section class="sec slim">
        <div class="container sec-head center reveal" style="margin-bottom:26px">
            <p class="kicker" data-i18n="home.stack.kicker"></p>
            <h2 data-i18n="home.stack.title"></h2>
        </div>
    </section>
    <div class="marquee" data-render="marquee" aria-hidden="true"></div>

    <section class="sec"><div data-render="teaser"></div></section>

    <section class="sec alt" id="testimonials">
        <div class="container">
            <header class="sec-head center reveal">
                <p class="kicker" data-i18n="home.testi.kicker"></p>
                <h2 data-i18n="home.testi.title"></h2>
            </header>
            <div data-render="testi"></div>
        </div>
    </section>

    <section class="band">
        <div class="container band-in reveal">
            <h2 data-i18n="home.band.t"></h2>
            <p data-i18n="home.band.d"></p>
            <div class="band-btns">
                <a class="btn btn-accent btn-cut" href="contact.html" data-i18n="home.band.a1.t"></a>
                <a class="btn btn-ghostw" href="pricing.html" data-i18n="home.band.a2.t"></a>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>

<script src="lang/prs.js"></script>
<script src="lang/ps.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
</body>
</html>

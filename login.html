<head>

<body data-page="login">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>

<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="login-wrap">
        <div class="container login-grid">
            <div class="login-side reveal">
                <p class="kicker" data-i18n="login.hero.kicker"></p>
                <h2 data-i18n="login.hero.title"></h2>
                <p class="lead" data-i18n="login.hero.sub"></p>
                <div data-render="loginPerks"></div>
            </div>
            <div class="login-card reveal" style="--d:120ms">
                <div class="login-hd">
                    <p class="kicker" data-i18n="login.side.kicker"></p>
                    <h2 data-i18n="login.side.title"></h2>
                    <p data-i18n="login.side.d"></p>
                </div>
                <div data-render="loginForm"></div>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="totop" id="toTop" aria-label="Back to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>

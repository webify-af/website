    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">

<body data-page="about">
<a class="skip" href="#main">Skip to content</a>
<div class="topstrip" id="topstrip"></div>
<header class="site-header" id="siteHeader"></header>
<div class="drawer-bd"></div>
<aside class="drawer" id="drawer" aria-label="mobile menu"></aside>

<main id="main">
    <section class="hero">
        <div class="container hero-in">
            <nav class="crumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><b data-i18n="meta.about"></b></nav>
            <p class="kicker" data-scramble data-i18n="about.hero.kicker"></p>
            <h1 class="ml" data-i18n="about.hero.title"></h1>
            <p class="hero-sub" data-i18n="about.hero.sub"></p>
        </div>
    </section>
    <div class="page-nav" data-render="pn"></div>

    <section class="sec" id="story" data-spy>
        <div class="container split">
            <div class="reveal">
                <p class="kicker" data-i18n="about.story.kicker"></p>
                <h2 data-i18n="about.story.title"></h2>
                <p class="lead" style="margin-top:12px" data-i18n="about.story.p1"></p>
                <p class="lead" style="margin-top:12px" data-i18n="about.story.p2"></p>
            </div>
            <div class="reveal" style="--d:120ms">
                <figure class="why-fig"><img src="https://picsum.photos/seed/webify-team-story/720/480" alt="Webify team"></figure>
                <div class="facts">
                    <div><b><span data-count="8">0</span></b><small data-i18n="about.story.facts.0.l"></small></div>
                    <div><b><span data-count="120">0</span>+</b><small data-i18n="about.story.facts.1.l"></small></div>
                    <div><b><span data-count="6">0</span></b><small data-i18n="about.story.facts.2.l"></small></div>
                </div>
            </div>
        </div>
    </section>

    <section class="sec alt" id="values" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="about.values.kicker"></p><h2 data-i18n="about.values.title"></h2></header>
            <div data-render="values"></div>
        </div>
    </section>

    <section class="sec" id="stack" data-spy>
        <div class="container">
            <header class="sec-head reveal"><p class="kicker" data-i18n="about.stack.kicker"></p><h2 data-i18n="about.stack.title"></h2><p class="lead" data-i18n="about.stack.sub"></p></header>
            <div data-render="stackGroups"></div>
        </div>
    </section>

    <section class="sec alt" id="philosophy" data-spy>
        <div class="container split">
            <div class="sticky reveal">
                <p class="kicker" data-i18n="about.phil.kicker"></p>
                <h2 data-i18n="about.phil.title"></h2>
                <p class="lead" style="margin-top:12px" data-i18n="about.phil.lead"></p>
                <blockquote class="case-quote" style="margin-top:22px"><p data-i18n="about.phil.quote"></p></blockquote>
            </div>
            <div class="why-list">
                <div class="card why-item reveal"><b class="wnum">01</b><div><h3 data-i18n="about.phil.items.0.t"></h3><p data-i18n="about.phil.items.0.d"></p></div></div>
                <div class="card why-item reveal" style="--d:90ms"><b class="wnum">02</b><div><h3 data-i18n="about.phil.items.1.t"></h3><p data-i18n="about.phil.items.1.d"></p></div></div>
                <div class="card why-item reveal" style="--d:180ms"><b class="wnum">03</b><div><h3 data-i18n="about.phil.items.2.t"></h3><p data-i18n="about.phil.items.2.d"></p></div></div>
                <div class="card why-item reveal" style="--d:270ms"><b class="wnum">04</b><div><h3 data-i18n="about.phil.items.3.t"></h3><p data-i18n="about.phil.items.3.d"></p></div></div>
            </div>
        </div>
    </section>

    <section class="sec" id="team" data-spy>
        <div class="container">
            <header class="sec-head center reveal"><p class="kicker" data-i18n="about.team.kicker"></p><h2 data-i18n="about.team.title"></h2></header>
            <div data-render="team"></div>
        </div>
    </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
